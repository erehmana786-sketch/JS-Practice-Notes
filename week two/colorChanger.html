<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color changer</title>
</head>
<body>
    <button id="white" style="background-color: rgb(0, 234, 255); border: 2px solid black; border-radius: 10px; width:100px; height: 100px;">Click</button>
    <button id="green" style="background-color: orange; border: 2px solid black; border-radius: 10px; width:100px; height: 100px;">Submit</button>
    <button id="yellow" style="background-color: yellow; border: 2px solid black; border-radius: 10px; width:100px; height: 100px;">Add</button>
</body>
</html>
